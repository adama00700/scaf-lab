[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaf-lab"
version = "1.0.0"
description = "scaf — Structural Conservation Adaptive Flow: Physics-based medical imaging reconstruction"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "scaf Research Laboratory"}
]
keywords = [
    "MRI", "medical imaging", "reconstruction", "conservation law",
    "image processing", "echocardiography", "ECG", "AI hallucination detection"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
full = [
    "scikit-image>=0.19.0",
    "matplotlib>=3.5.0",
    "h5py>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/scaf-lab/scaf"
Documentation = "https://scaf-lab.github.io/scaf"
Repository = "https://github.com/scaf-lab/scaf"
Issues = "https://github.com/scaf-lab/scaf/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scaf*"]

[tool.pytest.ini_options]
testpaths = ["scaf/tests"]
python_files = ["test_*.py"]
